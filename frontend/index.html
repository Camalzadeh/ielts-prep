<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Prep</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233056d3'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3EIE%3C/text%3E%3C/svg%3E">
  <script>
    // Apply theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('ielts.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/player.css">
  <script src="vendor/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main id="main" class="page" tabindex="-1">
        <div class="loading-block"><span class="spinner"></span> Loading…</div>
      </main>
    </div>
  </div>
  <div id="fullscreen-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
